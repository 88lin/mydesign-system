<!DOCTYPE html>
<html lang="zh-CN" data-palette="A">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title><!-- App标题 --></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
  <!-- 配色：改 <html data-palette="A"~"J"> 即可整站换色，见 palettes.css -->
  <link rel="stylesheet" href="palettes.css">
  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--cream);
    }

    ::selection {
      background: var(--highlight);
      color: var(--ink);
    }

    /* === Fixed Header === */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
      background: var(--cream);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
    }

    .app-header h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* === Tab栏 === */
    .tab-bar {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      border-bottom: 2px solid var(--border);
      padding: 0 1.5rem;
      background: var(--cream);
    }

    .tab {
      padding: 12px 20px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--ink-light);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all .2s;
      white-space: nowrap;
    }

    .tab.active {
      border-bottom-color: var(--brand);
      color: var(--brand-text);
      font-weight: 600;
    }

    .tab:hover:not(.active) {
      color: var(--ink);
    }

    /* === 内容区 === */
    .app-content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* === 卡片网格 === */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .app-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 2px 12px rgba(0,0,0,.04);
      transition: transform .2s, box-shadow .2s;
      cursor: pointer;
    }

    .app-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }

    .app-card h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .app-card p {
      font-size: 0.85rem;
      color: var(--ink-light);
    }

    .card-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 0.7rem;
      background: rgba(var(--brand-rgb), .1);
      color: var(--brand-text);
      margin-bottom: 0.5rem;
    }

    /* === Tab内容切换 === */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .tab:focus-visible,
    .modal-close:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 3px;
    }

    /* === Modal === */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,.6);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      background: var(--cream);
      border-radius: 16px;
      padding: 2rem;
      max-width: 560px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--card-bg);
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* === 输入框 === */
    .app-input {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9rem;
      transition: border-color .2s;
      background: var(--card-bg);
      width: 100%;
    }

    .app-input:focus {
      outline: none;
      border-color: var(--brand-border);
      box-shadow: 0 0 0 3px rgba(var(--brand-rgb), .1);
    }

    /* === 响应式 === */
    @media (max-width: 600px) {
      .app-content { padding: 1.5rem 1rem; }
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ====== Fixed Header ====== -->
  <header class="app-header">
    <h1><!-- App名称 --></h1>
    <div class="header-actions">
      <!-- 操作按钮 -->
    </div>
  </header>

  <!-- ====== Tab栏 ====== -->
  <div class="tab-bar" role="tablist" aria-label="内容视图">
    <button class="tab active" id="tab1-trigger" role="tab" aria-label="标签1" aria-selected="true" aria-controls="tab1" data-tab="tab1"><!-- 标签1 --></button>
    <button class="tab" id="tab2-trigger" role="tab" aria-label="标签2" aria-selected="false" aria-controls="tab2" data-tab="tab2"><!-- 标签2 --></button>
    <button class="tab" id="tab3-trigger" role="tab" aria-label="标签3" aria-selected="false" aria-controls="tab3" data-tab="tab3"><!-- 标签3 --></button>
  </div>

  <!-- ====== 内容区 ====== -->
  <main class="app-content">

    <!-- Tab 1 内容 -->
    <div class="tab-content active" id="tab1" role="tabpanel" aria-labelledby="tab1-trigger">
      <div class="card-grid">
        <div class="app-card">
          <span class="card-badge"><!-- 分类 --></span>
          <h3><!-- 卡片标题 --></h3>
          <p><!-- 卡片描述 --></p>
        </div>
        <!-- 更多卡片 -->
      </div>
    </div>

    <!-- Tab 2 内容 -->
    <div class="tab-content" id="tab2" role="tabpanel" aria-labelledby="tab2-trigger">
      <!-- 另一组内容 -->
    </div>

    <!-- Tab 3 内容 -->
    <div class="tab-content" id="tab3" role="tabpanel" aria-labelledby="tab3-trigger">
      <!-- 另一组内容 -->
    </div>

  </main>

  <!-- ====== Modal ====== -->
  <div class="modal-overlay" id="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-label="弹窗">
      <button class="modal-close" onclick="closeModal()" aria-label="关闭弹窗">×</button>
      <!-- Modal内容 -->
    </div>
  </div>

  <!-- ====== JS ====== -->
  <script>
    // Tab切换
    const tabs = [...document.querySelectorAll('.tab')];
    const modal = document.getElementById('modal');
    let lastFocusedElement = null;

    function activateTab(tab) {
      tabs.forEach(t => {
        const isActive = t === tab;
        t.classList.toggle('active', isActive);
        t.setAttribute('aria-selected', String(isActive));
      });
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.toggle('active', content.id === tab.dataset.tab);
      });
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => activateTab(tab));
      tab.addEventListener('keydown', event => {
        const index = tabs.indexOf(tab);
        const nextIndex = event.key === 'ArrowRight' || event.key === 'ArrowDown'
          ? (index + 1) % tabs.length
          : event.key === 'ArrowLeft' || event.key === 'ArrowUp'
            ? (index - 1 + tabs.length) % tabs.length
            : event.key === 'Home'
              ? 0
              : event.key === 'End'
                ? tabs.length - 1
                : -1;
        if (nextIndex < 0) return;
        event.preventDefault();
        tabs[nextIndex].focus();
        activateTab(tabs[nextIndex]);
      });
    });

    // Modal
    function openModal() {
      lastFocusedElement = document.activeElement;
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => {
        const firstControl = modal.querySelector('input, textarea, select, button');
        firstControl?.focus();
      });
    }
    function closeModal() {
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      if (lastFocusedElement instanceof HTMLElement && document.contains(lastFocusedElement)) {
        lastFocusedElement.focus();
      }
      lastFocusedElement = null;
    }

    modal.addEventListener('click', event => {
      if (event.target === event.currentTarget) closeModal();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && modal.classList.contains('active')) closeModal();
    });
  </script>

</body>
</html>
