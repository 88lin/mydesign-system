<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- 页面标题 --></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Caveat:wght@400..700&family=Noto+Serif+SC:wght@300..900&family=Noto+Sans+SC:wght@300..900&family=Fira+Code:wght@400..600&display=swap" rel="stylesheet">
  <style>
    /* === CSS变量 === */
    /* tokens:start — generated by scripts/build_tokens.py, do not edit */
    :root {
      /* ==== v2.2.0 品牌色（语义命名） ==== */
      --brand: #A63D6F;  /* 莓果玫红 · 主色 60% */
      --brand-deep: #88325B;  /* 莓果深调 · 主色加深 */
      --brand-soft: #F4E1EA;  /* 莓果浅晕 · 浅色块 */
      --accent: #B59AD4;  /* 藤萝紫 · 强调色 30% */
      --accent-ink: #885CBA;  /* 藤萝深调 · 强调色文字安全变体 */
      --accent-deep: #6F46A0;  /* 藤萝浓调 · 强调色 chip 文字 */
      --accent-soft: #EAE2F3;  /* 藤萝浅晕 · 浅色块 */
      --pop: #E84A5F;  /* 点缀红 · 点缀色 10% */
      --pop-ink: #DD1C36;  /* 点缀深红 · 点缀色文字安全变体 */
      --pop-deep: #B00F25;  /* 点缀浓红 · 点缀色 chip 文字 */
      --cream: #fefcf6;  /* 暖底主色 · 背景 */
      --cream-dark: #faf6eb;  /* 深奶底 · 背景 */
      --card-bg: #FFFDF8;  /* 卡片底 · 背景 */
      --ink: #1A1A2E;  /* 墨色 · 正文 */
      --ink-light: #4A4A5A;  /* 次要墨 · 次要文字 */
      --ink-faint: #6F6F81;  /* 浅墨 · 辅助文字 */
      --dark-panel: #201826;  /* 梅黑面板 · 深色面板 */
      --term-bg: #151821;  /* 终端底 · 具名例外 */
      --term-green: #4ADE80;  /* 终端绿 · 具名例外 */
      --panel-green: #2D6A4F;  /* 功能绿 · 功能色 */
      --paper: #F5F0E8;  /* 纸感底 · 肌理 */
      --paper-line: #D4C9B5;  /* 纸感线 · 肌理 */
      --hairline: #E8E4D9;  /* 细分隔线 · 边框 */
      /* ==== 半透明 ==== */
      --border: rgba(26, 26, 46, 0.10);
      --border-strong: rgba(26, 26, 46, 0.18);
      --shadow: rgba(26, 26, 46, 0.08);
      --brand-wash: rgba(166, 61, 111, 0.08);
      --accent-wash: rgba(181, 154, 212, 0.25);
      --pop-wash: rgba(232, 74, 95, 0.12);
      --green-wash: rgba(45, 106, 79, 0.12);
      /* ==== 代码/终端面板 · 具名例外（其他场景禁用冷调） ==== */
      --code-bg: #1A1B26;  /* 深色代码面板底 */
      --code-tb: #2D2D3A;  /* macOS 窗口标题栏底 */
      --code-fg: #A9B1D6;  /* 正文 */
      --code-kw: #BB9AF7;  /* 关键字 */
      --code-fn: #7AA2F7;  /* 函数名 */
      --code-str: #9ECE6A;  /* 字符串 */
      --code-num: #FF9E64;  /* 数字/字面量 */
      --code-cmt: #8A94BE;  /* 注释 */
      --code-file: #A3A9BD;  /* 标题栏文件名 */
      --code-lt-fg: var(--ink-light);  /* 浅底代码面板 · 正文 */
      --code-lt-kw: var(--accent-ink);  /* 浅底代码面板 · 关键字 */
      --code-lt-fn: var(--brand);  /* 浅底代码面板 · 函数名 */
      --code-lt-str: var(--panel-green);  /* 浅底代码面板 · 字符串 */
      --code-lt-num: var(--pop-ink);  /* 浅底代码面板 · 数字/字面量 */
      --code-lt-cmt: var(--ink-faint);  /* 浅底代码面板 · 注释 */
      /* ==== 字体栈 ==== */
      --font-serif: 'Huiwen Mincho', 'Noto Serif SC', 'Songti SC', 'STSong', serif;
      --font-sans: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-display: 'Fraunces', 'Noto Serif SC', serif;
      --font-script: 'Caveat', 'Noto Serif SC', cursive;
      --font-mono: 'Fira Code', 'SFMono-Regular', Consolas, monospace;
      /* ==== fluid 字号 ==== */
      --fs-hero: clamp(2.8rem, 7vw, 5.5rem);
      --fs-section-title: clamp(1.6rem, 4vw, 2.6rem);
      --fs-card-title: clamp(1.15rem, 2vw, 1.4rem);
      --fs-body: clamp(0.98rem, 1.6vw, 1rem);
      --fs-small: clamp(0.78rem, 1.2vw, 0.85rem);
      --fs-deco-number: clamp(3rem, 8vw, 7rem);
      /* ==== 间距 ==== */
      --sp-section: clamp(80px, 12vh, 160px);
      --sp-block: clamp(40px, 6vw, 100px);
      --sp-card-pad: clamp(28px, 3vw, 44px);
      --sp-gap: clamp(24px, 3vw, 48px);
      --sp-max-width: 1300px;
      /* ==== 旧变量名兼容层（新代码请勿使用） ==== */
      --blue: var(--brand);
      --blue-deep: var(--brand-deep);
      --yellow: var(--accent);
      --yellow-soft: var(--accent-soft);
      --red: var(--pop);
      --accent-light: var(--accent);
    }
/* tokens:end */

    /* === Reset === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.7;
      color: var(--ink);
      background: var(--cream);
    }

    ::selection {
      background: var(--accent);
      color: var(--ink);
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* === Hero Section === */
    /* 替换为适合的Hero布局（参见layouts.md） */
    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 0.6fr;
      align-items: center;
      gap: 48px;
      padding: 6rem 2rem 4rem;
      max-width: 1300px;
      margin: 0 auto;
    }

    .hero h1 {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      line-height: 1.15;
    }

    .hero p {
      font-size: 1.05rem;
      color: var(--ink-light);
      margin-top: 1.5rem;
      max-width: 540px;
    }

    .label-caps {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 500;
      color: var(--ink-faint);
      display: block;
      margin-bottom: 0.75rem;
    }

    /* === Content Sections === */
    /* 每个section使用不同布局（参见layouts.md） */
    .section {
      padding: clamp(80px, 12vh, 160px) 0;
    }

    .section--alt {
      background: var(--cream-dark);
    }

    .section-header {
      margin-bottom: clamp(40px, 6vw, 80px);
    }

    .section-number {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: var(--brand);
      opacity: 0.3;
      display: block;
      margin-bottom: 0.25rem;
    }

    .section-title {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
    }

    /* === 卡片 === */
    .feature-card {
      background: var(--cream-dark);
      border-radius: 16px;
      padding: clamp(24px, 3vw, 36px);
      border-bottom: 4px solid var(--accent);
      transition: transform 0.3s ease;
    }
    .feature-card:hover { transform: translateY(-4px); }

    /* === Scroll Reveal === */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-d1 { transition-delay: 0.1s; }
    .reveal-d2 { transition-delay: 0.2s; }
    .reveal-d3 { transition-delay: 0.3s; }
    .reveal-d4 { transition-delay: 0.4s; }
    .reveal-d5 { transition-delay: 0.5s; }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
    }

    /* === 响应式 === */
    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
        padding: 4rem 1.5rem 3rem;
      }
    }

    @media (max-width: 600px) {
      body { font-size: 15px; }
    }
  
    /* ds:a11y-focus */
    /* 键盘可达性：只在键盘导航时显形，鼠标点击不出现难看的外框。
       两层 box-shadow 保证焦点环在任何底色上都看得见（浅底靠品牌色，深底靠奶白色）。 */
    a:focus-visible,
    button:focus-visible,
    [tabindex]:focus-visible,
    [onclick]:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 3px;
      border-radius: 3px;
      box-shadow: 0 0 0 5px var(--cream), 0 0 0 7px var(--brand-soft);
    }
    :focus:not(:focus-visible) { outline: none; }
  
    /* ds:reduced-motion */
    /* 前庭功能障碍用户会因视差/位移动效眩晕，系统开了"减少动态效果"就全部停掉。
       用 !important + 极短时长而不是 none：保留动画的结束状态，避免元素停在起始的透明态。 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .reveal, [class*="reveal"] { opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>

  <!-- ====== HERO ====== -->
  <!-- 从layouts.md选择合适的Hero布局 -->
  <section class="hero">
    <div class="hero-text">
      <span class="label-caps"><!-- 分类标签 --></span>
      <h1><!-- 主标题 --></h1>
      <p><!-- 副标题/描述 --></p>
    </div>
    <div class="hero-visual">
      <!-- 视觉元素：图片/装饰/IP形象 -->
    </div>
  </section>

  <!-- ====== SECTION 1 ====== -->
  <!-- 选择不同于Hero的布局（如Sticky侧栏/Step流程/卡片网格） -->
  <section class="section">
    <div class="container">
      <div class="section-header reveal">
        <span class="section-number">01</span>
        <h2 class="section-title"><!-- Section标题 --></h2>
      </div>
      <div class="reveal reveal-d1">
        <!-- Section内容 -->
      </div>
    </div>
  </section>

  <!-- ====== SECTION 2 ====== -->
  <!-- 选择另一种不同布局 -->
  <section class="section section--alt">
    <div class="container">
      <div class="section-header reveal">
        <span class="section-number">02</span>
        <h2 class="section-title"><!-- Section标题 --></h2>
      </div>
      <div class="reveal reveal-d1">
        <!-- Section内容 -->
      </div>
    </div>
  </section>

  <!-- ====== SECTION 3 ====== -->
  <!-- 可选：深色面板打破节奏 -->
  <section class="section" style="background: var(--dark-panel); color: #FEFCF6;">
    <div class="container">
      <div class="reveal">
        <!-- 重点内容/引用 -->
      </div>
    </div>
  </section>

  <!-- ====== FOOTER ====== -->
  <footer class="section" style="padding: clamp(40px, 6vh, 80px) 0; text-align: center;">
    <div class="container">
      <p style="font-size: 0.85rem; color: var(--ink-faint);"><!-- 底部信息 --></p>
    </div>
  </footer>

  <!-- ====== Scroll Reveal JS ====== -->
  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>

</body>
</html>
