<!DOCTYPE html>
<html lang="zh-CN" data-palette="a">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图文卡片</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Fraunces:ital,wght@1,400;1,700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<script src="html2canvas.min.js" onerror="console.error('html2canvas failed to load')"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* ==== PALETTE SYSTEM · 同步自 assets/palettes.css —— 请勿单独手改 ====
   换配色：改 <html data-palette="a|b|c|d|e">。a=原色 b=松墨 c=陶土 d=梅子 e=山墨
   页面 CSS 只引用第 2 层语义令牌；--blue/--yellow/--red 作为兼容别名保留。 */
/* A · 原色 — Cobalt & Butter · 日常首选 · 教程 · 科普 */
:root,
[data-palette="a"] {
  --p-name: "A · 原色";
  --p-primary: #2B7FD8; --p-primary-deep: #1E5BA8; --p-primary-soft: #E2EEFE;
  --p-accent: #F4D758; --p-accent-soft: #FFF3CD; --p-accent-ink: #78671B;
  --p-pop: #E84A5F; --p-pop-deep: #BF2A44;
  --p-cream: #FEFCF6; --p-cream-dark: #FAF6EB; --p-card: #FFFEFC;
  --p-ink: #1A1A2E; --p-ink-light: #4A4A5A; --p-ink-faint: #6D6E7E;
  --p-dark-panel: #151821; --p-dark-panel-2: #292B3C;
  --p-ink-rgb: 26, 26, 46; --p-primary-rgb: 43, 127, 216; --p-accent-rgb: 244, 215, 88; --p-pop-rgb: 232, 74, 95;
}
/* B · 松墨 — Ink Pine · 长文 · 读书笔记 · 复盘 */
[data-palette="b"] {
  --p-name: "B · 松墨";
  --p-primary: #35774B; --p-primary-deep: #175830; --p-primary-soft: #DFF3E3;
  --p-accent: #EEBC5D; --p-accent-soft: #FEEED4; --p-accent-ink: #846015;
  --p-pop: #D15A42; --p-pop-deep: #AA3C27;
  --p-cream: #FEFCF6; --p-cream-dark: #F7F1E3; --p-card: #FFFEFC;
  --p-ink: #19211C; --p-ink-light: #454E48; --p-ink-faint: #646E68;
  --p-dark-panel: #0F1C15; --p-dark-panel-2: #223028;
  --p-ink-rgb: 25, 33, 28; --p-primary-rgb: 53, 119, 75; --p-accent-rgb: 238, 188, 93; --p-pop-rgb: 209, 90, 66;
}
/* C · 陶土 — Terracotta · 作品集 · 生活方式 · 活动页 */
[data-palette="c"] {
  --p-name: "C · 陶土";
  --p-primary: #B35630; --p-primary-deep: #8E3912; --p-primary-soft: #FEE8DF;
  --p-accent: #ECD06E; --p-accent-soft: #FDF1C5; --p-accent-ink: #7A6514;
  --p-pop: #348979; --p-pop-deep: #16695A;
  --p-cream: #FFFCF5; --p-cream-dark: #F9F1E0; --p-card: #FFFEFC;
  --p-ink: #271D18; --p-ink-light: #564942; --p-ink-faint: #786961;
  --p-dark-panel: #241710; --p-dark-panel-2: #382921;
  --p-ink-rgb: 39, 29, 24; --p-primary-rgb: 179, 86, 48; --p-accent-rgb: 236, 208, 110; --p-pop-rgb: 52, 137, 121;
}
/* D · 梅子 — Mulberry & Honey · 个人主页 · 分享会 · 图文卡片 */
[data-palette="d"] {
  --p-name: "D · 梅子";
  --p-primary: #87486D; --p-primary-deep: #652D4F; --p-primary-soft: #F9E7F0;
  --p-accent: #FCCC69; --p-accent-soft: #FEEFD2; --p-accent-ink: #826114;
  --p-pop: #5F8041; --p-pop-deep: #426126;
  --p-cream: #FFFCF6; --p-cream-dark: #F8F1E3; --p-card: #FFFEFC;
  --p-ink: #271C23; --p-ink-light: #53494F; --p-ink-faint: #756971;
  --p-dark-panel: #24151D; --p-dark-panel-2: #37272F;
  --p-ink-rgb: 39, 28, 35; --p-primary-rgb: 135, 72, 109; --p-accent-rgb: 252, 204, 105; --p-pop-rgb: 95, 128, 65;
}
/* E · 山墨 — Sumi & Vermilion · 作品集 · 观点长文 · 高级感 */
[data-palette="e"] {
  --p-name: "E · 山墨";
  --p-primary: #3C352E; --p-primary-deep: #221B15; --p-primary-soft: #F9EADB;
  --p-accent: #E5CCA6; --p-accent-soft: #FEEED7; --p-accent-ink: #81612E;
  --p-pop: #C8482F; --p-pop-deep: #A12911;
  --p-cream: #FEFCF6; --p-cream-dark: #F8F1E2; --p-card: #FFFEFC;
  --p-ink: #221F1A; --p-ink-light: #504B46; --p-ink-faint: #716B65;
  --p-dark-panel: #1F1812; --p-dark-panel-2: #322B24;
  --p-ink-rgb: 34, 31, 26; --p-primary-rgb: 60, 53, 46; --p-accent-rgb: 229, 204, 166; --p-pop-rgb: 200, 72, 47;
}
:root {
  --brand-primary: var(--p-primary); --brand-primary-deep: var(--p-primary-deep); --brand-primary-soft: var(--p-primary-soft);
  --brand-accent: var(--p-accent); --brand-accent-soft: var(--p-accent-soft); --brand-accent-ink: var(--p-accent-ink);
  --brand-pop: var(--p-pop); --brand-pop-deep: var(--p-pop-deep);
  --cream: var(--p-cream); --cream-dark: var(--p-cream-dark); --card-bg: var(--p-card);
  --ink: var(--p-ink); --ink-light: var(--p-ink-light); --ink-faint: var(--p-ink-faint);
  --dark-panel: var(--p-dark-panel); --dark-panel-2: var(--p-dark-panel-2);
  --ink-rgb: var(--p-ink-rgb); --brand-primary-rgb: var(--p-primary-rgb);
  --brand-accent-rgb: var(--p-accent-rgb); --brand-pop-rgb: var(--p-pop-rgb);
  --border: rgba(var(--p-ink-rgb), .09); --border-strong: rgba(var(--p-ink-rgb), .16);
  --focus-ring: var(--brand-primary-deep);
  --highlighter: linear-gradient(transparent 60%, var(--brand-accent) 60%);
  /* 兼容别名 */
  --blue: var(--brand-primary); --blue-deep: var(--brand-primary-deep);
  --yellow: var(--brand-accent); --yellow-soft: var(--brand-accent-soft);
  --red: var(--brand-pop);
}
::selection { background: var(--brand-accent); color: var(--ink); }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; border-radius: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important; scroll-behavior: auto !important }
}
/* ==== /PALETTE SYSTEM ==== */

body {
  background: #e8e4de;
  font-family: 'Noto Sans SC', sans-serif;
  color: var(--ink);
  padding: 40px 20px;
}

/* ========== 导出栏 ========== */
.export-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 9999;
  background: var(--ink);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.export-bar button {
  background: var(--brand-primary-deep);
  color: #fff;
  border: none;
  padding: 10px 28px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Noto Sans SC', sans-serif;
}

.export-bar button:hover { filter: brightness(1.12); }

.export-bar .hint {
  color: rgba(255, 255, 255, .62);
  font-size: 13px;
}

/* ========== 卡片容器 ========== */
.cards-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  margin-top: 80px;
}

.card {
  width: 1080px;
  height: 1440px;
  position: relative;
  overflow: hidden;
  transform: scale(0.45);
  transform-origin: top center;
  margin-bottom: -792px;
  border-radius: 4px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.12);
}

/* ========== P1 封面 ========== */
.p-cover {
  background: var(--cream);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 80px 90px;
}

.p-cover .deco-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 8px;
  background: linear-gradient(90deg, var(--blue) 60%, var(--yellow) 80%, var(--red) 100%);
}

.p-cover .tag {
  font-size: 28px;
  font-weight: 700;
  color: #fff;
  background: var(--blue);
  display: inline-block;
  padding: 8px 24px;
  border-radius: 6px;
  margin-bottom: 40px;
  letter-spacing: 2px;
}

.p-cover h1 {
  font-family: 'Noto Serif SC', serif;
  font-weight: 900;
  font-size: 88px;
  line-height: 1.2;
  color: var(--ink);
  margin-bottom: 24px;
}

.p-cover h1 .highlight { color: var(--blue); }

.p-cover .subtitle {
  font-size: 42px;
  color: var(--ink-light);
  font-weight: 500;
  line-height: 1.6;
  margin-bottom: 80px;
}

.p-cover .author-row {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-top: auto;
}

.p-cover .avatar {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--yellow);
}

.p-cover .author-name {
  font-size: 36px;
  font-weight: 700;
  color: var(--ink);
}

.p-cover .author-desc {
  font-size: 24px;
  color: var(--ink-light);
  margin-top: 4px;
}

/* ========== 深色面板页 ========== */
.p-dark {
  background: var(--ink);
  display: flex;
  flex-direction: column;
  padding: 80px 80px;
}

.p-dark .page-num {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 120px;
  color: var(--yellow);
  opacity: 0.15;
  position: absolute;
  top: 40px;
  right: 80px;
  font-weight: 700;
}

.p-dark h2 {
  font-family: 'Noto Serif SC', serif;
  font-weight: 900;
  font-size: 52px;
  color: var(--cream);
  margin-bottom: 16px;
}

.p-dark .sub {
  font-size: 32px;
  color: var(--yellow);
  margin-bottom: 60px;
  font-weight: 500;
}

.p-dark .items {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 36px;
}

.p-dark .item {
  display: flex;
  align-items: flex-start;
  gap: 24px;
}

.p-dark .item .icon {
  font-size: 40px;
  flex-shrink: 0;
  width: 56px;
  text-align: center;
}

.p-dark .item .text {
  font-size: 38px;
  color: #e8e4de;
  line-height: 1.5;
  font-weight: 500;
}

.p-dark .item .text strong {
  color: #fff;
  font-weight: 700;
}

.p-dark .deco-line {
  position: absolute;
  bottom: 80px;
  left: 80px;
  right: 80px;
  height: 4px;
  background: linear-gradient(90deg, var(--blue) 50%, var(--yellow) 75%, var(--red) 100%);
  border-radius: 2px;
  opacity: 0.6;
}

/* ========== 浅色列表页 ========== */
.p-list {
  background: var(--cream);
  display: flex;
  flex-direction: column;
  padding: 72px 80px;
}

.p-list .page-num {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 120px;
  color: var(--blue);
  opacity: 0.12;
  position: absolute;
  top: 40px;
  right: 80px;
  font-weight: 700;
}

.p-list h2 {
  font-family: 'Noto Serif SC', serif;
  font-weight: 900;
  font-size: 52px;
  margin-bottom: 48px;
  color: var(--ink);
}

.p-list h2::after {
  content: '';
  display: block;
  width: 80px;
  height: 6px;
  background: var(--yellow);
  margin-top: 16px;
  border-radius: 3px;
}

.p-list .content-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 24px;
}

/* ========== 尾页 ========== */
.p-end {
  background: var(--cream);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 80px 90px;
  text-align: center;
}

.p-end .deco-bottom {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 8px;
  background: linear-gradient(90deg, var(--blue) 60%, var(--yellow) 80%, var(--red) 100%);
}

.p-end .quote-mark {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 200px;
  color: var(--blue);
  opacity: 0.15;
  line-height: 0.6;
  margin-bottom: -20px;
}

.p-end .quote {
  font-family: 'Noto Serif SC', serif;
  font-weight: 900;
  font-size: 60px;
  line-height: 1.5;
  color: var(--ink);
  margin-bottom: 32px;
  max-width: 900px;
}

.p-end .quote .highlight {
  color: var(--blue);
  text-decoration: underline;
  text-decoration-color: var(--yellow);
  text-underline-offset: 8px;
  text-decoration-thickness: 4px;
}

.p-end .avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--yellow);
  margin-bottom: 20px;
}

.p-end .author-name {
  font-size: 40px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 8px;
}

.p-end .cta {
  font-size: 32px;
  color: var(--blue);
  font-weight: 600;
  margin-bottom: 48px;
}

.p-end .tagline {
  font-size: 26px;
  color: var(--ink-light);
  letter-spacing: 2px;
}
</style>
</head>
<body>

<div class="export-bar">
  <button onclick="exportAll()">📥 一键导出PNG</button>
  <span class="hint">每张卡片导出为1080×1440 PNG</span>
</div>

<div class="cards-container">

<!-- ===== P1 封面 ===== -->
<!-- 大标题+副标题+头像+署名。内容少，字要大，留白多。 -->
<div class="card p-cover" data-card="1">
  <div class="deco-top"></div>
  <span class="tag"><!-- 分类标签，如"AI教程"、"效率工具" --></span>
  <h1><!-- 主标题，72-96px --><span class="highlight"><!-- 高亮关键词 --></span></h1>
  <p class="subtitle"><!-- 副标题/一句话说明 --></p>
  <div class="author-row">
    <img class="avatar" src="avatar.jpg" alt="脆皮头像">
    <div>
      <div class="author-name">脆皮</div>
      <div class="author-desc"><!-- 你的一句话介绍 --></div>
    </div>
  </div>
</div>

<!-- ===== P2 深色面板页示例 ===== -->
<!-- 适合代码、文件树、核心要点强调。深色底+亮色文字。 -->
<div class="card p-dark" data-card="2">
  <span class="page-num">02</span>
  <h2><!-- 页面标题 --></h2>
  <p class="sub"><!-- 副标题/小字说明 --></p>
  <div class="items">
    <!-- 每项：icon + 文字说明 -->
    <div class="item">
      <span class="icon"><!-- emoji --></span>
      <span class="text"><strong><!-- 要点标题 --></strong><!-- 说明文字 --></span>
    </div>
    <!-- 重复3-6项 -->
  </div>
  <div class="deco-line"></div>
</div>

<!-- ===== P3 浅色列表页示例 ===== -->
<!-- 适合步骤、列表、分点说明。浅色底+oversized编号装饰。 -->
<div class="card p-list" data-card="3">
  <span class="page-num">03</span>
  <h2><!-- 页面标题 --></h2>
  <div class="content-area">
    <!-- 根据内容选择排版：
         - 步骤流程：oversized编号 + 文字
         - 对比列表：色块交替行
         - 代码展示：深色代码面板
         - 自由组合，避免与其他页重复 -->
  </div>
</div>

<!-- ===== 最后一页 尾页 ===== -->
<!-- 金句+头像+CTA。oversized引号装饰，居中大字。 -->
<div class="card p-end" data-card="last">
  <div class="deco-bottom"></div>
  <div class="quote-mark">"</div>
  <p class="quote"><!-- 金句/核心观点 --><span class="highlight"><!-- 高亮关键词 --></span></p>
  <img class="avatar" src="avatar.jpg" alt="脆皮头像">
  <p class="author-name">脆皮</p>
  <p class="cta">关注脆皮</p>
  <p class="tagline"><!-- 签名档第一行 --><br><!-- 签名档第二行 --></p>
</div>

</div><!-- cards-container -->

<script>
async function exportAll() {
  if (typeof html2canvas === 'undefined') {
    alert('⏳ html2canvas 正在加载，请稍等几秒后重试。');
    return;
  }
  if (typeof JSZip === 'undefined') {
    alert('JSZip 加载失败，请刷新重试。');
    return;
  }
  const cards = document.querySelectorAll('.card');
  const btn = document.querySelector('.export-bar button');
  btn.textContent = '⏳ 导出中... 0/' + cards.length;
  btn.disabled = true;

  const zip = new JSZip();
  const folder = zip.folder('cards-export');

  for (let i = 0; i < cards.length; i++) {
    const card = cards[i];
    card.style.transform = 'none';
    card.style.marginBottom = '0';
    card.style.borderRadius = '0';
    card.style.boxShadow = 'none';

    await new Promise(r => setTimeout(r, 150));

    try {
      const canvas = await html2canvas(card, {
        width: 1080,
        height: 1440,
        scale: 1,
        useCORS: true,
        allowTaint: true,
        backgroundColor: null,
        logging: false
      });

      const dataUrl = canvas.toDataURL('image/png');
      const base64 = dataUrl.split(',')[1];
      folder.file(`card-${String(i + 1).padStart(2, '0')}.png`, base64, {base64: true});

      btn.textContent = `⏳ 导出中... ${i + 1}/${cards.length}`;
    } catch(e) {
      console.error('Export error on card ' + (i+1), e);
    } finally {
      card.style.transform = 'scale(0.45)';
      card.style.marginBottom = '-792px';
      card.style.borderRadius = '4px';
      card.style.boxShadow = '0 8px 40px rgba(0,0,0,0.12)';
    }
  }

  btn.textContent = '⏳ 打包中...';
  const blob = await zip.generateAsync({type: 'blob'});
  const link = document.createElement('a');
  link.download = 'cards-export.zip';
  link.href = URL.createObjectURL(blob);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(link.href);

  btn.textContent = '✅ 导出完成';
  setTimeout(() => { btn.textContent = '📥 一键导出PNG'; btn.disabled = false; }, 2000);
}
</script>


</body>
</html>
