<!DOCTYPE html>
<html lang="zh-CN" data-palette="rose">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图文卡片</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Fraunces:ital,wght@1,400;1,700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* ==== PALETTE SYSTEM · 同步自 assets/palettes.css —— 请勿单独手改 ====
   换配色：改 <html data-palette="rose|wine|sakura|wisteria|bluebell|celadon|sage|latte|greige|heather">。默认 rose。
   rose=茶玫  wine=胭脂  sakura=樱  wisteria=藕荷  bluebell=雾霞  celadon=青瓷  sage=艾绿  latte=奶咖  greige=烟灰玫  heather=雪青
   页面 CSS 只引用第 2 层语义令牌；--blue/--yellow/--red 作为兼容别名保留。 */
/* 茶玫 — Rose Tea · 日常首选 · 教程 · 图文卡片 */
:root,
[data-palette="rose"] {
  --p-name: "茶玫";
  --p-primary: #A15C63; --p-primary-deep: #7E4047; --p-primary-soft: #FEE6E7;
  --p-accent: #EED0A3; --p-accent-soft: #FFEED5; --p-accent-ink: #85601D;

  --p-ink: #24181E; --p-ink-light: #50474B; --p-ink-faint: #71686C;
  --p-dark-panel: #1D1318; --p-dark-panel-2: #33292E;
  --p-ink-rgb: 36, 24, 30; --p-primary-rgb: 161, 92, 99; --p-accent-rgb: 238, 208, 163; --p-pop-rgb: 69, 130, 112;
}
/* 胭脂 — Bordeaux Rouge · 长文 · 观点 · 深度复盘 */
[data-palette="wine"] {
  --p-name: "胭脂";

  --p-dark-panel: #1D1318; --p-dark-panel-2: #34292E;

/* 樱 — Sakura · 活动页 · 节日 · 高饱和场合 */
[data-palette="sakura"] {

/* 藕荷 — Wisteria · 个人主页 · 分享会 · 手帐感 */
[data-palette="wisteria"] {

/* 雾霞 — Misty Bluebell · 科普 · 教程 · 需要冷静可信的场合 */
[data-palette="bluebell"] {
  --p-name: "雾霞";
  --p-primary: #5C6A9F; --p-primary-deep: #404C7C; --p-primary-soft: #E6ECFF;

  --p-cream: #FCF8EF; --p-cream-dark: #F6EEE0; --p-card: #FFFEFD;

/* 青瓷 — Celadon & Blush · 作品集 · 生活方式 · 清冷感 */
[data-palette="celadon"] {
  --p-name: "青瓷";
  --p-primary: #2E807F; --p-primary-deep: #195F5F; --p-primary-soft: #DAF3F2;
  --p-accent: #F9BAC4; --p-accent-soft: #FFEBED; --p-accent-ink: #97515F;
  --p-pop: #A25F32; --p-pop-deep: #7F4216;
  --p-cream: #FCF8EF; --p-cream-dark: #F5EFE0; --p-card: #FFFEFD;
  --p-ink: #131E1E; --p-ink-light: #434B4B; --p-ink-faint: #646C6C;

}
/* 艾绿 — Sage & Honey · 读书笔记 · 植物 · 慢生活 */
[data-palette="sage"] {
  --p-name: "艾绿";
  --p-primary: #587255; --p-primary-deep: #3C543A; --p-primary-soft: #E3F2E2;
  --p-accent: #EDD080; --p-accent-soft: #FBF0D1; --p-accent-ink: #7C641C;
  --p-pop: #A25483; --p-pop-deep: #7F3863;
  --p-cream: #FDF8EF; --p-cream-dark: #F7EEE1; --p-card: #FFFEFE;
  --p-ink: #181E19; --p-ink-light: #464B47; --p-ink-faint: #676C68;
  --p-dark-panel: #121813; --p-dark-panel-2: #292E29;
  --p-ink-rgb: 24, 30, 25; --p-primary-rgb: 88, 114, 85; --p-accent-rgb: 237, 208, 128; --p-pop-rgb: 162, 84, 131;
}
/* 奶咖 — Latte · 作品集 · 简历 · 极简排版 */
[data-palette="latte"] {
  --p-name: "奶咖";
  --p-primary: #7D5D45; --p-primary-deep: #5D412B; --p-primary-soft: #FBE9DC;
  --p-accent: #BBE5C4; --p-accent-soft: #DDF9E3; --p-accent-ink: #357449;
  --p-pop: #287A83; --p-pop-deep: #175A61;
  --p-cream: #FEF7F0; --p-cream-dark: #F9EDE2; --p-card: #FFFEFE;
  --p-ink: #211B17; --p-ink-light: #4D4845; --p-ink-faint: #6E6A66;
  --p-dark-panel: #1A1512; --p-dark-panel-2: #302C27;
  --p-ink-rgb: 33, 27, 23; --p-primary-rgb: 125, 93, 69; --p-accent-rgb: 187, 229, 196; --p-pop-rgb: 40, 122, 131;
}
/* 烟灰玫 — Smoked Greige · 摄影图文 · 不想抢图的场合 */
[data-palette="greige"] {
  --p-name: "烟灰玫";
  --p-primary: #7C6B75; --p-primary-deep: #5D4E57; --p-primary-soft: #FAE6F2;
  --p-accent: #DDD2F1; --p-accent-soft: #F3EDFF; --p-accent-ink: #735B97;
  --p-pop: #4B5D8E; --p-pop-deep: #30406C;
  --p-cream: #FEF7F4; --p-cream-dark: #F8ECE8; --p-card: #FFFEFE;
  --p-ink: #211A1E; --p-ink-light: #4E484C; --p-ink-faint: #6E696C;
  --p-dark-panel: #1A1519; --p-dark-panel-2: #302B2E;
  --p-ink-rgb: 33, 26, 30; --p-primary-rgb: 124, 107, 117; --p-accent-rgb: 221, 210, 241; --p-pop-rgb: 75, 93, 142;
}
/* 雪青 — Heather · 长文 · 安静克制的个人主页 */
[data-palette="heather"] {
  --p-name: "雪青";
  --p-primary: #635B7B; --p-primary-deep: #463F5B; --p-primary-soft: #EEEAFD;
  --p-accent: #F9D0C7; --p-accent-soft: #FFECE7; --p-accent-ink: #995346;
  --p-pop: #8E5C9D; --p-pop-deep: #6D407B;
  --p-cream: #FEF7F1; --p-cream-dark: #F9EDE3; --p-card: #FFFEFE;
  --p-ink: #1D1B22; --p-ink-light: #4A494E; --p-ink-faint: #6B6A70;
  --p-dark-panel: #17151B; --p-dark-panel-2: #2D2C32;
  --p-ink-rgb: 29, 27, 34; --p-primary-rgb: 99, 91, 123; --p-accent-rgb: 249, 208, 199; --p-pop-rgb: 142, 92, 157;
}
:root {
  --brand-primary: var(--p-primary); --brand-primary-deep: var(--p-primary-deep); --brand-primary-soft: var(--p-primary-soft);
  --brand-accent: var(--p-accent); --brand-accent-soft: var(--p-accent-soft); --brand-accent-ink: var(--p-accent-ink);
  --brand-pop: var(--p-pop); --brand-pop-deep: var(--p-pop-deep);
  --cream: var(--p-cream); --cream-dark: var(--p-cream-dark); --card-bg: var(--p-card);
  --ink: var(--p-ink); --ink-light: var(--p-ink-light); --ink-faint: var(--p-ink-faint);
  --dark-panel: var(--p-dark-panel); --dark-panel-2: var(--p-dark-panel-2);
  --ink-rgb: var(--p-ink-rgb); --brand-primary-rgb: var(--p-primary-rgb);
  --brand-accent-rgb: var(--p-accent-rgb); --brand-pop-rgb: var(--p-pop-rgb);
  --border: rgba(var(--p-ink-rgb), .09); --border-strong: rgba(var(--p-ink-rgb), .16);
  --focus-ring: var(--brand-primary-deep);
  --highlighter: linear-gradient(transparent 60%, var(--brand-accent) 60%);
  /* 兼容别名 */
  --blue: var(--brand-primary); --blue-deep: var(--brand-primary-deep);
  --yellow: var(--brand-accent); --yellow-soft: var(--brand-accent-soft);
  --red: var(--brand-pop);
}
::selection { background: var(--brand-accent); color: var(--ink); }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; border-radius: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important; scroll-behavior: auto !important }
}
/* ==== /PALETTE SYSTEM ==== */

body {
  background: #e8e4de;
  font-family: 'Noto Sans SC', sans-serif;
  color: var(--ink);
  padding: 40px 20px;
}

/* ========== 导出栏 ========== */
.export-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 9999;
  background: var(--ink);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.export-bar button {
  background: var(--brand-primary-deep);
  color: #fff;
  border: none;
  padding: 10px 28px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Noto Sans SC', sans-serif;
}

.export-bar button:hover { filter: brightness(1.12); }

.export-bar .hint {
  color: rgba(255, 255, 255, .62);
  font-size: 13px;
}

/* ========== 卡片容器 ========== */
.cards-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  margin-top: 80px;
}

.card {
  width: 1080px;
  height: 1440px;
  position: relative;
  overflow: hidden;
  transform: scale(0.45);
  transform-origin: top center;
  margin-bottom: -792px;
  border-radius: 4px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.12);
}

/* ========== P1 封面 ========== */
.p-cover {
  background: var(--cream);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 80px 90px;
}

.p-cover .deco-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 8px;
  background: linear-gradient(90deg, var(--brand-primary) 60%, var(--brand-accent) 80%, var(--brand-pop) 100%);
}

.p-cover .tag {
  font-size: 28px;
  font-weight: 700;
  color: #fff;
  background: var(--brand-primary);
  display: inline-block;
  padding: 8px 24px;
  border-radius: 6px;
  margin-bottom: 40px;
  letter-spacing: 2px;
}

.p-cover h1 {
  font-family: 'Noto Serif SC', serif;
  font-weight: 900;
  font-size: 88px;
  line-height: 1.2;
  color: var(--ink);
  margin-bottom: 24px;
}

.p-cover h1 .highlight { color: var(--brand-primary); }

.p-cover .subtitle {
  font-size: 42px;
  color: var(--ink-light);
  font-weight: 500;
  line-height: 1.6;
  margin-bottom: 80px;
}

.p-cover .author-row {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-top: auto;
}

.p-cover .avatar {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--brand-accent);
}

.p-cover .author-name {
  font-size: 36px;
  font-weight: 700;
  color: var(--ink);
}

.p-cover .author-desc {
  font-size: 24px;
  color: var(--ink-light);
  margin-top: 4px;
}

/* ========== 深色面板页 ========== */
.p-dark {
  background: var(--ink);
  display: flex;
  flex-direction: column;
  padding: 80px 80px;
}

.p-dark .page-num {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 120px;
  color: var(--brand-accent);
  opacity: 0.15;
  position: absolute;
  top: 40px;
  right: 80px;
  font-weight: 700;
}

.p-dark h2 {
  font-family: 'Noto Serif SC', serif;
  font-weight: 900;
  font-size: 52px;
  color: var(--cream);
  margin-bottom: 16px;
}

.p-dark .sub {
  font-size: 32px;
  color: var(--brand-accent);
  margin-bottom: 60px;
  font-weight: 500;
}

.p-dark .items {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 36px;
}

.p-dark .item {
  display: flex;
  align-items: flex-start;
  gap: 24px;
}

.p-dark .item .icon {
  font-size: 40px;
  flex-shrink: 0;
  width: 56px;
  text-align: center;
}

.p-dark .item .text {
  font-size: 38px;
  color: #e8e4de;
  line-height: 1.5;
  font-weight: 500;
}

.p-dark .item .text strong {
  color: #fff;
  font-weight: 700;
}

.p-dark .deco-line {
  position: absolute;
  bottom: 80px;
  left: 80px;
  right: 80px;
  height: 4px;
  background: linear-gradient(90deg, var(--brand-primary) 50%, var(--brand-accent) 75%, var(--brand-pop) 100%);
  border-radius: 2px;
  opacity: 0.6;
}

/* ========== 浅色列表页 ========== */
.p-list {
  background: var(--cream);
  display: flex;
  flex-direction: column;
  padding: 72px 80px;
}

.p-list .page-num {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 120px;
  color: var(--brand-primary);
  opacity: 0.12;
  position: absolute;
  top: 40px;
  right: 80px;
  font-weight: 700;
}

.p-list h2 {
  font-family: 'Noto Serif SC', serif;
  font-weight: 900;
  font-size: 52px;
  margin-bottom: 48px;
  color: var(--ink);
}

.p-list h2::after {
  content: '';
  display: block;
  width: 80px;
  height: 6px;
  background: var(--brand-accent);
  margin-top: 16px;
  border-radius: 3px;
}

.p-list .content-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 24px;
}

/* ========== 尾页 ========== */
.p-end {
  background: var(--cream);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 80px 90px;
  text-align: center;
}

.p-end .deco-bottom {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 8px;
  background: linear-gradient(90deg, var(--brand-primary) 60%, var(--brand-accent) 80%, var(--brand-pop) 100%);
}

.p-end .quote-mark {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 200px;
  color: var(--brand-primary);
  opacity: 0.15;
  line-height: 0.6;
  margin-bottom: -20px;
}

.p-end .quote {
  font-family: 'Noto Serif SC', serif;
  font-weight: 900;
  font-size: 60px;
  line-height: 1.5;
  color: var(--ink);
  margin-bottom: 32px;
  max-width: 900px;
}

.p-end .quote .highlight {
  color: var(--brand-primary);
  text-decoration: underline;
  text-decoration-color: var(--brand-accent);
  text-underline-offset: 8px;
  text-decoration-thickness: 4px;
}

.p-end .avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--brand-accent);
  margin-bottom: 20px;
}

.p-end .author-name {
  font-size: 40px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 8px;
}

.p-end .cta {
  font-size: 32px;
  color: var(--brand-primary);
  font-weight: 600;
  margin-bottom: 48px;
}

.p-end .tagline {
  font-size: 26px;
  color: var(--ink-light);
  letter-spacing: 2px;
}
</style>
</head>
<body>

<div class="export-bar">
  <button onclick="exportAll()">📥 一键导出PNG</button>
  <span class="hint">每张卡片导出为1080×1440 PNG</span>
</div>

<div class="cards-container">

<!-- ===== P1 封面 ===== -->
<!-- 大标题+副标题+头像+署名。内容少，字要大，留白多。 -->
<div class="card p-cover" data-card="1">
  <div class="deco-top"></div>
  <span class="tag"><!-- 分类标签，如"AI教程"、"效率工具" --></span>
  <h1><!-- 主标题，72-96px --><span class="highlight"><!-- 高亮关键词 --></span></h1>
  <p class="subtitle"><!-- 副标题/一句话说明 --></p>
  <div class="author-row">
    <img class="avatar" src="avatar.jpg" alt="你的头像">
    <div>
      <div class="author-name">脆皮</div>
      <div class="author-desc"><!-- 你的一句话介绍 --></div>
    </div>
  </div>
</div>

<!-- ===== P2 深色面板页示例 ===== -->
<!-- 适合代码、文件树、核心要点强调。深色底+亮色文字。 -->
<div class="card p-dark" data-card="2">
  <span class="page-num" aria-hidden="true">02</span>
  <h2><!-- 页面标题 --></h2>
  <p class="sub"><!-- 副标题/小字说明 --></p>
  <div class="items">
    <!-- 每项：icon + 文字说明 -->
    <div class="item">
      <span class="icon"><!-- emoji --></span>
      <span class="text"><strong><!-- 要点标题 --></strong><!-- 说明文字 --></span>
    </div>
    <!-- 重复3-6项 -->
  </div>
  <div class="deco-line"></div>
</div>

<!-- ===== P3 浅色列表页示例 ===== -->
<!-- 适合步骤、列表、分点说明。浅色底+oversized编号装饰。 -->
<div class="card p-list" data-card="3">
  <span class="page-num" aria-hidden="true">03</span>
  <h2><!-- 页面标题 --></h2>
  <div class="content-area">
    <!-- 根据内容选择排版：
         - 步骤流程：oversized编号 + 文字
         - 对比列表：色块交替行
         - 代码展示：深色代码面板
         - 自由组合，避免与其他页重复 -->
  </div>
</div>

<!-- ===== 最后一页 尾页 ===== -->
<!-- 金句+头像+CTA。oversized引号装饰，居中大字。 -->
<div class="card p-end" data-card="last">
  <div class="deco-bottom"></div>
  <div class="quote-mark" aria-hidden="true">"</div>
  <p class="quote"><!-- 金句/核心观点 --><span class="highlight"><!-- 高亮关键词 --></span></p>
  <img class="avatar" src="avatar.jpg" alt="你的头像">
  <p class="author-name">脆皮</p>
  <p class="cta">关注脆皮</p>
  <p class="tagline"><!-- 签名档第一行 --><br><!-- 签名档第二行 --></p>
</div>

</div><!-- cards-container -->

<script>
async function exportAll() {
  if (typeof html2canvas === 'undefined') {
    alert('⏳ html2canvas 正在加载，请稍等几秒后重试。');
    return;
  }
  if (typeof JSZip === 'undefined') {
    alert('JSZip 加载失败，请刷新重试。');
    return;
  }
  const cards = document.querySelectorAll('.card');
  const btn = document.querySelector('.export-bar button');
  btn.textContent = '⏳ 导出中... 0/' + cards.length;
  btn.disabled = true;

  const zip = new JSZip();
  const folder = zip.folder('cards-export');

  for (let i = 0; i < cards.length; i++) {
    const card = cards[i];
    card.style.transform = 'none';
    card.style.marginBottom = '0';
    card.style.borderRadius = '0';
    card.style.boxShadow = 'none';

    await new Promise(r => setTimeout(r, 150));

    try {
      const canvas = await html2canvas(card, {
        width: 1080,
        height: 1440,
        scale: 1,
        useCORS: true,
        allowTaint: true,
        backgroundColor: null,
        logging: false
      });

      const dataUrl = canvas.toDataURL('image/png');
      const base64 = dataUrl.split(',')[1];
      folder.file(`card-${String(i + 1).padStart(2, '0')}.png`, base64, {base64: true});

      btn.textContent = `⏳ 导出中... ${i + 1}/${cards.length}`;
    } catch(e) {
      console.error('Export error on card ' + (i+1), e);
    } finally {
      card.style.transform = 'scale(0.45)';
      card.style.marginBottom = '-792px';
      card.style.borderRadius = '4px';
      card.style.boxShadow = '0 8px 40px rgba(0,0,0,0.12)';
    }
  }

  btn.textContent = '⏳ 打包中...';
  const blob = await zip.generateAsync({type: 'blob'});
  const link = document.createElement('a');
  link.download = 'cards-export.zip';
  link.href = URL.createObjectURL(blob);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(link.href);

  btn.textContent = '✅ 导出完成';
  setTimeout(() => { btn.textContent = '📥 一键导出PNG'; btn.disabled = false; }, 2000);
}
</script>
