<!DOCTYPE html>
<html lang="zh-CN" data-palette="a">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- 页面标题 --></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Caveat:wght@400;700&family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
  <style>
    /* === CSS变量 === */
    /* ==== PALETTE SYSTEM · 同步自 assets/palettes.css —— 请勿单独手改 ====
       换配色：改 <html data-palette="a|b|c|d|e">。a=原色 b=松墨 c=陶土 d=梅子 e=山墨
       页面 CSS 只引用第 2 层语义令牌；--blue/--yellow/--red 作为兼容别名保留。 */
    /* A · 原色 — Cobalt & Butter · 日常首选 · 教程 · 科普 */
    :root,
    [data-palette="a"] {
      --p-name: "A · 原色";
      --p-primary: #2B7FD8; --p-primary-deep: #1E5BA8; --p-primary-soft: #E2EEFE;
      --p-accent: #F4D758; --p-accent-soft: #FFF3CD; --p-accent-ink: #78671B;
      --p-pop: #E84A5F; --p-pop-deep: #BF2A44;
      --p-cream: #FEFCF6; --p-cream-dark: #FAF6EB; --p-card: #FFFEFC;
      --p-ink: #1A1A2E; --p-ink-light: #4A4A5A; --p-ink-faint: #6D6E7E;
      --p-dark-panel: #151821; --p-dark-panel-2: #292B3C;
      --p-ink-rgb: 26, 26, 46; --p-primary-rgb: 43, 127, 216; --p-accent-rgb: 244, 215, 88; --p-pop-rgb: 232, 74, 95;
    }
    /* B · 松墨 — Ink Pine · 长文 · 读书笔记 · 复盘 */
    [data-palette="b"] {
      --p-name: "B · 松墨";
      --p-primary: #35774B; --p-primary-deep: #175830; --p-primary-soft: #DFF3E3;
      --p-accent: #EEBC5D; --p-accent-soft: #FEEED4; --p-accent-ink: #846015;
      --p-pop: #D15A42; --p-pop-deep: #AA3C27;
      --p-cream: #FEFCF6; --p-cream-dark: #F7F1E3; --p-card: #FFFEFC;
      --p-ink: #19211C; --p-ink-light: #454E48; --p-ink-faint: #646E68;
      --p-dark-panel: #0F1C15; --p-dark-panel-2: #223028;
      --p-ink-rgb: 25, 33, 28; --p-primary-rgb: 53, 119, 75; --p-accent-rgb: 238, 188, 93; --p-pop-rgb: 209, 90, 66;
    }
    /* C · 陶土 — Terracotta · 作品集 · 生活方式 · 活动页 */
    [data-palette="c"] {
      --p-name: "C · 陶土";
      --p-primary: #B35630; --p-primary-deep: #8E3912; --p-primary-soft: #FEE8DF;
      --p-accent: #ECD06E; --p-accent-soft: #FDF1C5; --p-accent-ink: #7A6514;
      --p-pop: #348979; --p-pop-deep: #16695A;
      --p-cream: #FFFCF5; --p-cream-dark: #F9F1E0; --p-card: #FFFEFC;
      --p-ink: #271D18; --p-ink-light: #564942; --p-ink-faint: #786961;
      --p-dark-panel: #241710; --p-dark-panel-2: #382921;
      --p-ink-rgb: 39, 29, 24; --p-primary-rgb: 179, 86, 48; --p-accent-rgb: 236, 208, 110; --p-pop-rgb: 52, 137, 121;
    }
    /* D · 梅子 — Mulberry & Honey · 个人主页 · 分享会 · 图文卡片 */
    [data-palette="d"] {
      --p-name: "D · 梅子";
      --p-primary: #87486D; --p-primary-deep: #652D4F; --p-primary-soft: #F9E7F0;
      --p-accent: #FCCC69; --p-accent-soft: #FEEFD2; --p-accent-ink: #826114;
      --p-pop: #5F8041; --p-pop-deep: #426126;
      --p-cream: #FFFCF6; --p-cream-dark: #F8F1E3; --p-card: #FFFEFC;
      --p-ink: #271C23; --p-ink-light: #53494F; --p-ink-faint: #756971;
      --p-dark-panel: #24151D; --p-dark-panel-2: #37272F;
      --p-ink-rgb: 39, 28, 35; --p-primary-rgb: 135, 72, 109; --p-accent-rgb: 252, 204, 105; --p-pop-rgb: 95, 128, 65;
    }
    /* E · 山墨 — Sumi & Vermilion · 作品集 · 观点长文 · 高级感 */
    [data-palette="e"] {
      --p-name: "E · 山墨";
      --p-primary: #3C352E; --p-primary-deep: #221B15; --p-primary-soft: #F9EADB;
      --p-accent: #E5CCA6; --p-accent-soft: #FEEED7; --p-accent-ink: #81612E;
      --p-pop: #C8482F; --p-pop-deep: #A12911;
      --p-cream: #FEFCF6; --p-cream-dark: #F8F1E2; --p-card: #FFFEFC;
      --p-ink: #221F1A; --p-ink-light: #504B46; --p-ink-faint: #716B65;
      --p-dark-panel: #1F1812; --p-dark-panel-2: #322B24;
      --p-ink-rgb: 34, 31, 26; --p-primary-rgb: 60, 53, 46; --p-accent-rgb: 229, 204, 166; --p-pop-rgb: 200, 72, 47;
    }
    :root {
      --brand-primary: var(--p-primary); --brand-primary-deep: var(--p-primary-deep); --brand-primary-soft: var(--p-primary-soft);
      --brand-accent: var(--p-accent); --brand-accent-soft: var(--p-accent-soft); --brand-accent-ink: var(--p-accent-ink);
      --brand-pop: var(--p-pop); --brand-pop-deep: var(--p-pop-deep);
      --cream: var(--p-cream); --cream-dark: var(--p-cream-dark); --card-bg: var(--p-card);
      --ink: var(--p-ink); --ink-light: var(--p-ink-light); --ink-faint: var(--p-ink-faint);
      --dark-panel: var(--p-dark-panel); --dark-panel-2: var(--p-dark-panel-2);
      --ink-rgb: var(--p-ink-rgb); --brand-primary-rgb: var(--p-primary-rgb);
      --brand-accent-rgb: var(--p-accent-rgb); --brand-pop-rgb: var(--p-pop-rgb);
      --border: rgba(var(--p-ink-rgb), .09); --border-strong: rgba(var(--p-ink-rgb), .16);
      --focus-ring: var(--brand-primary-deep);
      --highlighter: linear-gradient(transparent 60%, var(--brand-accent) 60%);
      /* 兼容别名 */
      --blue: var(--brand-primary); --blue-deep: var(--brand-primary-deep);
      --yellow: var(--brand-accent); --yellow-soft: var(--brand-accent-soft);
      --red: var(--brand-pop);
    }
    ::selection { background: var(--brand-accent); color: var(--ink); }
    :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 3px; border-radius: 2px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important; scroll-behavior: auto !important }
    }
    /* ==== /PALETTE SYSTEM ==== */

    /* === Reset === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: var(--ink);
      background: var(--cream);
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* === Hero Section === */
    /* 替换为适合的Hero布局（参见layouts.md） */
    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 0.6fr;
      align-items: center;
      gap: 48px;
      padding: 6rem 2rem 4rem;
      max-width: 1300px;
      margin: 0 auto;
    }

    .hero h1 {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      line-height: 1.15;
    }

    .hero p {
      font-size: 1.05rem;
      color: var(--ink-light);
      margin-top: 1.5rem;
      max-width: 540px;
    }

    .label-caps {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 500;
      color: var(--ink-faint);
      display: block;
      margin-bottom: 0.75rem;
    }

    /* === Content Sections === */
    /* 每个section使用不同布局（参见layouts.md） */
    .section {
      padding: clamp(80px, 12vh, 160px) 0;
    }

    .section--alt {
      background: var(--cream-dark);
    }

    .section-header {
      margin-bottom: clamp(40px, 6vw, 80px);
    }

    .section-number {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: var(--blue);
      opacity: 0.3;
      display: block;
      margin-bottom: 0.25rem;
    }

    .section-title {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
    }

    /* === 卡片 === */
    .feature-card {
      background: var(--cream-dark);
      border-radius: 16px;
      padding: clamp(24px, 3vw, 36px);
      border-bottom: 4px solid var(--yellow);
      transition: transform 0.3s ease;
    }
    .feature-card:hover { transform: translateY(-4px); }

    /* === Scroll Reveal === */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-d1 { transition-delay: 0.1s; }
    .reveal-d2 { transition-delay: 0.2s; }
    .reveal-d3 { transition-delay: 0.3s; }
    .reveal-d4 { transition-delay: 0.4s; }
    .reveal-d5 { transition-delay: 0.5s; }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
    }

    /* === 响应式 === */
    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
        padding: 4rem 1.5rem 3rem;
      }
    }

    @media (max-width: 600px) {
      body { font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- ====== HERO ====== -->
  <!-- 从layouts.md选择合适的Hero布局 -->
  <section class="hero">
    <div class="hero-text">
      <span class="label-caps"><!-- 分类标签 --></span>
      <h1><!-- 主标题 --></h1>
      <p><!-- 副标题/描述 --></p>
    </div>
    <div class="hero-visual">
      <!-- 视觉元素：图片/装饰/IP形象 -->
    </div>
  </section>

  <!-- ====== SECTION 1 ====== -->
  <!-- 选择不同于Hero的布局（如Sticky侧栏/Step流程/卡片网格） -->
  <section class="section">
    <div class="container">
      <div class="section-header reveal">
        <span class="section-number">01</span>
        <h2 class="section-title"><!-- Section标题 --></h2>
      </div>
      <div class="reveal reveal-d1">
        <!-- Section内容 -->
      </div>
    </div>
  </section>

  <!-- ====== SECTION 2 ====== -->
  <!-- 选择另一种不同布局 -->
  <section class="section section--alt">
    <div class="container">
      <div class="section-header reveal">
        <span class="section-number">02</span>
        <h2 class="section-title"><!-- Section标题 --></h2>
      </div>
      <div class="reveal reveal-d1">
        <!-- Section内容 -->
      </div>
    </div>
  </section>

  <!-- ====== SECTION 3 ====== -->
  <!-- 可选：深色面板打破节奏 -->
  <section class="section" style="background: var(--dark-panel); color: #e2e8f0;">
    <div class="container">
      <div class="reveal">
        <!-- 重点内容/引用 -->
      </div>
    </div>
  </section>

  <!-- ====== FOOTER ====== -->
  <footer class="section" style="padding: clamp(40px, 6vh, 80px) 0; text-align: center;">
    <div class="container">
      <p style="font-size: 0.85rem; color: var(--ink-faint);"><!-- 底部信息 --></p>
    </div>
  </footer>

  <!-- ====== Scroll Reveal JS ====== -->
  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>

</body>
</html>
