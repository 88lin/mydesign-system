<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- App标题 --></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
  <style>
    /* === CSS变量（简化版） === */
    /* tokens:start — generated by scripts/build_tokens.py, do not edit */
    :root {
      /* ==== v2.2.0 品牌色（语义命名） ==== */
      --brand: #A63D6F;  /* 莓果玫红 · 主色 60% */
      --brand-deep: #88325B;  /* 莓果深调 · 主色加深 */
      --brand-soft: #F4E1EA;  /* 莓果浅晕 · 浅色块 */
      --accent: #B59AD4;  /* 藤萝紫 · 强调色 30% */
      --accent-ink: #885CBA;  /* 藤萝深调 · 强调色文字安全变体 */
      --accent-deep: #6F46A0;  /* 藤萝浓调 · 强调色 chip 文字 */
      --accent-soft: #EAE2F3;  /* 藤萝浅晕 · 浅色块 */
      --pop: #E84A5F;  /* 点缀红 · 点缀色 10% */
      --pop-ink: #DD1C36;  /* 点缀深红 · 点缀色文字安全变体 */
      --pop-deep: #B00F25;  /* 点缀浓红 · 点缀色 chip 文字 */
      --cream: #fefcf6;  /* 暖底主色 · 背景 */
      --cream-dark: #faf6eb;  /* 深奶底 · 背景 */
      --card-bg: #FFFDF8;  /* 卡片底 · 背景 */
      --ink: #1A1A2E;  /* 墨色 · 正文 */
      --ink-light: #4A4A5A;  /* 次要墨 · 次要文字 */
      --ink-faint: #6F6F81;  /* 浅墨 · 辅助文字 */
      --dark-panel: #201826;  /* 梅黑面板 · 深色面板 */
      --term-bg: #151821;  /* 终端底 · 具名例外 */
      --term-green: #4ADE80;  /* 终端绿 · 具名例外 */
      --panel-green: #2D6A4F;  /* 功能绿 · 功能色 */
      --paper: #F5F0E8;  /* 纸感底 · 肌理 */
      --paper-line: #D4C9B5;  /* 纸感线 · 肌理 */
      --hairline: #E8E4D9;  /* 细分隔线 · 边框 */
      /* ==== 半透明 ==== */
      --border: rgba(26, 26, 46, 0.10);
      --border-strong: rgba(26, 26, 46, 0.18);
      --shadow: rgba(26, 26, 46, 0.08);
      --brand-wash: rgba(166, 61, 111, 0.08);
      --accent-wash: rgba(181, 154, 212, 0.25);
      --pop-wash: rgba(232, 74, 95, 0.12);
      --green-wash: rgba(45, 106, 79, 0.12);
      /* ==== 代码/终端面板 · 具名例外（其他场景禁用冷调） ==== */
      --code-bg: #1A1B26;  /* 深色代码面板底 */
      --code-tb: #2D2D3A;  /* macOS 窗口标题栏底 */
      --code-fg: #A9B1D6;  /* 正文 */
      --code-kw: #BB9AF7;  /* 关键字 */
      --code-fn: #7AA2F7;  /* 函数名 */
      --code-str: #9ECE6A;  /* 字符串 */
      --code-num: #FF9E64;  /* 数字/字面量 */
      --code-cmt: #8A94BE;  /* 注释 */
      --code-file: #A3A9BD;  /* 标题栏文件名 */
      --code-lt-fg: var(--ink-light);  /* 浅底代码面板 · 正文 */
      --code-lt-kw: var(--accent-ink);  /* 浅底代码面板 · 关键字 */
      --code-lt-fn: var(--brand);  /* 浅底代码面板 · 函数名 */
      --code-lt-str: var(--panel-green);  /* 浅底代码面板 · 字符串 */
      --code-lt-num: var(--pop-ink);  /* 浅底代码面板 · 数字/字面量 */
      --code-lt-cmt: var(--ink-faint);  /* 浅底代码面板 · 注释 */
      /* ==== 字体栈 ==== */
      --font-serif: 'Huiwen Mincho', 'Noto Serif SC', 'Songti SC', 'STSong', serif;
      --font-sans: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-display: 'Fraunces', 'Noto Serif SC', serif;
      --font-script: 'Caveat', 'Noto Serif SC', cursive;
      --font-mono: 'Fira Code', 'SFMono-Regular', Consolas, monospace;
      /* ==== fluid 字号 ==== */
      --fs-hero: clamp(2.8rem, 7vw, 5.5rem);
      --fs-section-title: clamp(1.6rem, 4vw, 2.6rem);
      --fs-card-title: clamp(1.15rem, 2vw, 1.4rem);
      --fs-body: clamp(0.98rem, 1.6vw, 1rem);
      --fs-small: clamp(0.78rem, 1.2vw, 0.85rem);
      --fs-deco-number: clamp(3rem, 8vw, 7rem);
      /* ==== 间距 ==== */
      --sp-section: clamp(80px, 12vh, 160px);
      --sp-block: clamp(40px, 6vw, 100px);
      --sp-card-pad: clamp(28px, 3vw, 44px);
      --sp-gap: clamp(24px, 3vw, 48px);
      --sp-max-width: 1300px;
      /* ==== 旧变量名兼容层（新代码请勿使用） ==== */
      --blue: var(--brand);
      --blue-deep: var(--brand-deep);
      --yellow: var(--accent);
      --yellow-soft: var(--accent-soft);
      --red: var(--pop);
      --accent-light: var(--accent);
    }
/* tokens:end */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--cream);
    }

    ::selection {
      background: var(--yellow);
      color: var(--ink);
    }

    /* === Fixed Header === */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
      background: var(--cream);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
    }

    .app-header h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* === Tab栏 === */
    .tab-bar {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      border-bottom: 2px solid #eee;
      padding: 0 1.5rem;
      background: var(--cream);
    }

    .tab {
      padding: 12px 20px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--ink-light);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all .2s;
      white-space: nowrap;
    }

    .tab.active {
      border-bottom-color: var(--blue);
      color: var(--blue);
      font-weight: 600;
    }

    .tab:hover:not(.active) {
      color: var(--ink);
    }

    /* === 内容区 === */
    .app-content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* === 卡片网格 === */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .app-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 2px 12px rgba(0,0,0,.04);
      transition: transform .2s, box-shadow .2s;
      cursor: pointer;
    }

    .app-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }

    .app-card h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .app-card p {
      font-size: 0.85rem;
      color: var(--ink-light);
    }

    .card-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 0.7rem;
      background: rgba(166,61,111,0.1);
      color: var(--blue);
      margin-bottom: 0.5rem;
    }

    /* === Tab内容切换 === */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* === Modal === */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--cream);
      border-radius: 16px;
      padding: 2rem;
      max-width: 560px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--card-bg);
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* === 输入框 === */
    .app-input {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9rem;
      transition: border-color .2s;
      background: var(--card-bg);
      width: 100%;
    }

    .app-input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(166,61,111,0.1);
    }

    /* === 响应式 === */
    @media (max-width: 600px) {
      .app-content { padding: 1.5rem 1rem; }
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ====== Fixed Header ====== -->
  <header class="app-header">
    <h1><!-- App名称 --></h1>
    <div class="header-actions">
      <!-- 操作按钮 -->
    </div>
  </header>

  <!-- ====== Tab栏 ====== -->
  <div class="tab-bar">
    <button class="tab active" data-tab="tab1"><!-- 标签1 --></button>
    <button class="tab" data-tab="tab2"><!-- 标签2 --></button>
    <button class="tab" data-tab="tab3"><!-- 标签3 --></button>
  </div>

  <!-- ====== 内容区 ====== -->
  <main class="app-content">

    <!-- Tab 1 内容 -->
    <div class="tab-content active" id="tab1">
      <div class="card-grid">
        <div class="app-card">
          <span class="card-badge"><!-- 分类 --></span>
          <h3><!-- 卡片标题 --></h3>
          <p><!-- 卡片描述 --></p>
        </div>
        <!-- 更多卡片 -->
      </div>
    </div>

    <!-- Tab 2 内容 -->
    <div class="tab-content" id="tab2">
      <!-- 另一组内容 -->
    </div>

    <!-- Tab 3 内容 -->
    <div class="tab-content" id="tab3">
      <!-- 另一组内容 -->
    </div>

  </main>

  <!-- ====== Modal ====== -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">×</button>
      <!-- Modal内容 -->
    </div>
  </div>

  <!-- ====== JS ====== -->
  <script>
    // Tab切换
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });

    // Modal
    function openModal() {
      document.getElementById('modal').classList.add('active');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }
  </script>

</body>
</html>
