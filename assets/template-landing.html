<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- 活动标题 --></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Caveat:wght@400;700&family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* === CSS变量 === */
    /* tokens:start — generated by scripts/build_tokens.py, do not edit */
    :root {
      /* ==== v2.2.0 品牌色（语义命名） ==== */
      --brand: #A63D6F;  /* 莓果玫红 · 主色 60% */
      --brand-deep: #88325B;  /* 莓果深调 · 主色加深 */
      --brand-soft: #F4E1EA;  /* 莓果浅晕 · 浅色块 */
      --accent: #B59AD4;  /* 藤萝紫 · 强调色 30% */
      --accent-ink: #885CBA;  /* 藤萝深调 · 强调色文字安全变体 */
      --accent-deep: #6F46A0;  /* 藤萝浓调 · 强调色 chip 文字 */
      --accent-soft: #EAE2F3;  /* 藤萝浅晕 · 浅色块 */
      --pop: #E84A5F;  /* 点缀红 · 点缀色 10% */
      --pop-ink: #DD1C36;  /* 点缀深红 · 点缀色文字安全变体 */
      --pop-deep: #B00F25;  /* 点缀浓红 · 点缀色 chip 文字 */
      --cream: #fefcf6;  /* 暖底主色 · 背景 */
      --cream-dark: #faf6eb;  /* 深奶底 · 背景 */
      --card-bg: #FFFDF8;  /* 卡片底 · 背景 */
      --ink: #1A1A2E;  /* 墨色 · 正文 */
      --ink-light: #4A4A5A;  /* 次要墨 · 次要文字 */
      --ink-faint: #6F6F81;  /* 浅墨 · 辅助文字 */
      --dark-panel: #201826;  /* 梅黑面板 · 深色面板 */
      --term-bg: #151821;  /* 终端底 · 具名例外 */
      --term-green: #4ADE80;  /* 终端绿 · 具名例外 */
      --panel-green: #2D6A4F;  /* 功能绿 · 功能色 */
      --paper: #F5F0E8;  /* 纸感底 · 肌理 */
      --paper-line: #D4C9B5;  /* 纸感线 · 肌理 */
      --hairline: #E8E4D9;  /* 细分隔线 · 边框 */
      /* ==== 半透明 ==== */
      --border: rgba(26, 26, 46, 0.10);
      --border-strong: rgba(26, 26, 46, 0.18);
      --shadow: rgba(26, 26, 46, 0.08);
      --brand-wash: rgba(166, 61, 111, 0.08);
      --accent-wash: rgba(181, 154, 212, 0.25);
      --pop-wash: rgba(232, 74, 95, 0.12);
      --green-wash: rgba(45, 106, 79, 0.12);
      /* ==== 代码/终端面板 · 具名例外（其他场景禁用冷调） ==== */
      --code-bg: #1A1B26;  /* 深色代码面板底 */
      --code-tb: #2D2D3A;  /* macOS 窗口标题栏底 */
      --code-fg: #A9B1D6;  /* 正文 */
      --code-kw: #BB9AF7;  /* 关键字 */
      --code-fn: #7AA2F7;  /* 函数名 */
      --code-str: #9ECE6A;  /* 字符串 */
      --code-num: #FF9E64;  /* 数字/字面量 */
      --code-cmt: #8A94BE;  /* 注释 */
      --code-file: #A3A9BD;  /* 标题栏文件名 */
      --code-lt-fg: var(--ink-light);  /* 浅底代码面板 · 正文 */
      --code-lt-kw: var(--accent-ink);  /* 浅底代码面板 · 关键字 */
      --code-lt-fn: var(--brand);  /* 浅底代码面板 · 函数名 */
      --code-lt-str: var(--panel-green);  /* 浅底代码面板 · 字符串 */
      --code-lt-num: var(--pop-ink);  /* 浅底代码面板 · 数字/字面量 */
      --code-lt-cmt: var(--ink-faint);  /* 浅底代码面板 · 注释 */
      /* ==== 字体栈 ==== */
      --font-serif: 'Huiwen Mincho', 'Noto Serif SC', 'Songti SC', 'STSong', serif;
      --font-sans: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --font-display: 'Fraunces', 'Noto Serif SC', serif;
      --font-script: 'Caveat', 'Noto Serif SC', cursive;
      --font-mono: 'Fira Code', 'SFMono-Regular', Consolas, monospace;
      /* ==== fluid 字号 ==== */
      --fs-hero: clamp(2.8rem, 7vw, 5.5rem);
      --fs-section-title: clamp(1.6rem, 4vw, 2.6rem);
      --fs-card-title: clamp(1.15rem, 2vw, 1.4rem);
      --fs-body: clamp(0.98rem, 1.6vw, 1rem);
      --fs-small: clamp(0.78rem, 1.2vw, 0.85rem);
      --fs-deco-number: clamp(3rem, 8vw, 7rem);
      /* ==== 间距 ==== */
      --sp-section: clamp(80px, 12vh, 160px);
      --sp-block: clamp(40px, 6vw, 100px);
      --sp-card-pad: clamp(28px, 3vw, 44px);
      --sp-gap: clamp(24px, 3vw, 48px);
      --sp-max-width: 1300px;
      /* ==== 旧变量名兼容层（新代码请勿使用） ==== */
      --blue: var(--brand);
      --blue-deep: var(--brand-deep);
      --yellow: var(--accent);
      --yellow-soft: var(--accent-soft);
      --red: var(--pop);
      --accent-light: var(--accent);
    }
/* tokens:end */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: var(--ink);
      background: var(--cream);
    }

    ::selection {
      background: var(--yellow);
      color: var(--ink);
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* === HERO 全屏 === */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      position: relative;
    }

    .hero h1 {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--ink-light);
      max-width: 600px;
    }

    .hero .label-caps {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 500;
      color: var(--ink-faint);
      margin-bottom: 1rem;
    }

    /* === 三栏Section === */
    .section { padding: clamp(80px, 12vh, 160px) 0; }
    .section--alt { background: var(--cream-dark); }

    .section-header {
      margin-bottom: clamp(40px, 6vw, 80px);
    }

    .section-number {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: var(--blue);
      opacity: 0.3;
      display: block;
      margin-bottom: 0.25rem;
    }

    .section-title {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
    }

    .three-col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(20px, 2.5vw, 32px);
    }

    .chair-card {
      background: #fff;
      border-radius: 16px;
      padding: clamp(24px, 3vw, 36px);
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }
    .chair-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
    }
    .chair-card:nth-child(1)::before { background: var(--blue); }
    .chair-card:nth-child(2)::before { background: var(--yellow); }
    .chair-card:nth-child(3)::before { background: var(--red); }

    /* === 深色面板 === */
    .dark-section {
      background: var(--dark-panel);
      color: #FEFCF6;
      padding: clamp(80px, 12vh, 160px) 0;
    }

    .dark-section .quote-text {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(1.3rem, 3vw, 2rem);
      font-weight: 700;
      line-height: 1.8;
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
    }
    .dark-section .quote-text em {
      color: var(--yellow);
      font-style: normal;
    }

    /* === Pull Quote === */
    .viral-pullquote {
      padding: 36px 40px;
      background: var(--cream);
      border-radius: 16px;
      border: 2px solid var(--yellow);
      position: relative;
      max-width: 720px;
      margin: 0 auto;
    }
    .viral-pullquote::before {
      content: '"';
      font-family: 'Fraunces', serif;
      font-size: 5rem;
      color: var(--yellow);
      position: absolute;
      top: -10px; left: 20px;
      opacity: 0.5;
      line-height: 1;
    }
    .viral-pullquote p {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      font-weight: 700;
      line-height: 1.8;
    }

    /* === CTA === */
    .cta-section {
      text-align: center;
      padding: clamp(80px, 12vh, 160px) 2rem;
    }
    .cta-section h2 {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      margin-bottom: 1rem;
    }
    .cta-section p {
      font-size: 1rem;
      color: var(--ink-light);
      margin-bottom: 2rem;
    }
    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 16px 36px;
      background: var(--blue);
      color: #fff;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: transform .2s, box-shadow .2s;
    }
    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(166,61,111,0.3);
    }

    /* === Scroll Reveal === */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-d1 { transition-delay: 0.1s; }
    .reveal-d2 { transition-delay: 0.2s; }
    .reveal-d3 { transition-delay: 0.3s; }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
    }

    /* === 响应式 === */
    @media (max-width: 900px) {
      .hero { min-height: auto; padding: 4rem 1.5rem; }
      .three-col { grid-template-columns: 1fr; }
      .cta-button { width: 100%; justify-content: center; }
    }

    @media (max-width: 600px) {
      body { font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- ====== HERO 全屏 ====== -->
  <section class="hero">
    <span class="label-caps"><!-- 活动类型/日期 --></span>
    <h1><!-- 活动主标题 --></h1>
    <p><!-- 活动副标题/一句话描述 --></p>
  </section>

  <!-- ====== 三栏亮点 ====== -->
  <section class="section">
    <div class="container">
      <div class="section-header reveal">
        <span class="section-number">01</span>
        <h2 class="section-title"><!-- 亮点/嘉宾/核心价值 --></h2>
      </div>
      <div class="three-col">
        <div class="chair-card reveal reveal-d1">
          <!-- 卡片1内容 -->
        </div>
        <div class="chair-card reveal reveal-d2">
          <!-- 卡片2内容 -->
        </div>
        <div class="chair-card reveal reveal-d3">
          <!-- 卡片3内容 -->
        </div>
      </div>
    </div>
  </section>

  <!-- ====== 深色面板（金句/核心观点） ====== -->
  <section class="dark-section">
    <div class="container reveal">
      <p class="quote-text"><!-- 引用的 <em>重点词</em> 内容 --></p>
    </div>
  </section>

  <!-- ====== Pull Quote ====== -->
  <section class="section section--alt">
    <div class="container">
      <div class="viral-pullquote reveal">
        <p><!-- 核心金句 --></p>
      </div>
    </div>
  </section>

  <!-- ====== CTA行动区 ====== -->
  <section class="cta-section">
    <h2 class="reveal"><!-- 行动号召标题 --></h2>
    <p class="reveal reveal-d1"><!-- 行动描述 --></p>
    <a href="#" class="cta-button reveal reveal-d2"><!-- 按钮文案 --></a>
  </section>

  <!-- ====== Scroll Reveal JS ====== -->
  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>

</body>
</html>
